<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0f150e;
            color: #dee4d9;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col pb-32">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 backdrop-blur-xl bg-surface/90">
<div class="flex justify-between items-center w-full px-md h-16 max-w-7xl mx-auto">
<div class="flex items-center gap-sm">
<button class="p-sm hover:bg-surface-variant/50 transition-colors rounded-full active:scale-90 transition-transform">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<h1 class="font-h1 text-h1 font-bold text-primary">Financier</h1>
</div>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant">history</span>
</div>
</div>
</header>
<main class="flex-grow px-container-margin max-w-xl mx-auto w-full pt-lg space-y-xl">
<!-- Toggle Switch -->
<div class="flex justify-center">
<div class="bg-surface-container-high p-1 rounded-full flex w-full max-w-xs transition-all">
<button class="flex-1 py-2 px-4 rounded-full font-label-caps text-label-caps bg-primary text-on-primary font-bold transition-all">EXPENSE</button>
<button class="flex-1 py-2 px-4 rounded-full font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-all">INCOME</button>
</div>
</div>
<!-- Currency Input Section -->
<section class="text-center py-lg space-y-sm">
<p class="font-label-caps text-label-caps text-on-surface-variant opacity-70">AMOUNT</p>
<div class="flex items-center justify-center gap-2">
<span class="font-h1 text-h1 text-primary">$</span>
<input class="bg-transparent border-none focus:ring-0 text-center font-h1 text-[64px] leading-tight text-on-surface w-full max-w-[280px]" readonly="" type="text" value="0.00"/>
</div>
</section>
<!-- Date & Note Inputs -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<button class="glass-card p-md rounded-xl flex items-center gap-md active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary">calendar_today</span>
<div class="text-left">
<p class="font-caption text-caption text-on-surface-variant">Date</p>
<p class="font-body-md text-body-md text-on-surface">Today, Oct 24</p>
</div>
</button>
<div class="glass-card p-md rounded-xl flex items-center gap-md focus-within:ring-1 ring-primary/30 transition-all">
<span class="material-symbols-outlined text-primary">edit_note</span>
<div class="text-left w-full">
<p class="font-caption text-caption text-on-surface-variant">Note</p>
<input class="bg-transparent border-none focus:ring-0 p-0 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 w-full" placeholder="What was this for?" type="text"/>
</div>
</div>
</div>
<!-- Category Grid -->
<section class="space-y-md">
<h2 class="font-h2 text-h2 text-on-surface">Category</h2>
<div class="grid grid-cols-4 sm:grid-cols-6 gap-gutter">
<!-- Category Item 1 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">restaurant</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Food</span>
</button>
<!-- Category Item 2 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">commute</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Transport</span>
</button>
<!-- Category Item 3 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">shopping_bag</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Shopping</span>
</button>
<!-- Category Item 4 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">medical_services</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Health</span>
</button>
<!-- Category Item 5 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">movie</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Entertain</span>
</button>
<!-- Category Item 6 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">home</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Housing</span>
</button>
<!-- Category Item 7 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">school</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Edu</span>
</button>
<!-- Category Item 8 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">fitness_center</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Gym</span>
</button>
<!-- Category Item 9 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">receipt</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Bills</span>
</button>
<!-- Category Item 10 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">flight</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Travel</span>
</button>
<!-- Category Item 11 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">pets</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Pets</span>
</button>
<!-- Category Item 12 -->
<button class="flex flex-col items-center gap-sm group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container transition-all group-active:scale-90">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">grid_view</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Others</span>
</button>
</div>
</section>
<!-- Soft Number Pad -->
<section class="glass-card rounded-3xl p-md grid grid-cols-3 gap-base">
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90">1</button>
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90">2</button>
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90">3</button>
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90">4</button>
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90">5</button>
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90">6</button>
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90">7</button>
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90">8</button>
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90">9</button>
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90">.</button>
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90">0</button>
<button class="h-16 flex items-center justify-center font-h2 text-h2 hover:bg-surface-variant/30 rounded-2xl transition-all active:scale-90 text-error">
<span class="material-symbols-outlined">backspace</span>
</button>
</section>
</main>
<!-- Sticky Bottom Button -->
<div class="fixed bottom-0 left-0 w-full p-container-margin bg-gradient-to-t from-background via-background to-transparent pt-lg z-50">
<div class="max-w-xl mx-auto">
<button class="w-full bg-primary py-lg rounded-full text-on-primary font-h2 text-h2 shadow-lg active:scale-95 transition-all flex items-center justify-center gap-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Save Transaction
            </button>
</div>
</div>
</body></html>
